<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA TOUCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#03040c; --cyan:#4dd9ff; --mag:#ff4dd2; --gold:#ffd24d; --mist:#7c85ad; --white:#f4f2ec; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink);font-family:'Heebo',sans-serif;color:var(--white)}

  /* ================= CINEMATIC SPLASH ================= */
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);cursor:pointer}
  #splash.hide{display:none}

  .stars{position:absolute;inset:0;overflow:hidden}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:0}50%{opacity:.7}}

  #logoWrap{position:relative;text-align:center;transform:scale(.85);opacity:0;animation:logoIn 2.2s cubic-bezier(.16,1,.3,1) .4s forwards}
  @keyframes logoIn{0%{transform:scale(.6);opacity:0;filter:blur(18px)}60%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}

  #logoWrap .ring{position:absolute;top:50%;left:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;
    border:1px solid rgba(77,217,255,.25);animation:ringSpin 14s linear infinite}
  #logoWrap .ring.r2{width:420px;height:420px;margin:-210px 0 0 -210px;border-color:rgba(255,77,210,.15);animation-duration:22s;animation-direction:reverse}
  @keyframes ringSpin{to{transform:rotate(360deg)}}

  #logoWrap h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(58px,13vw,110px);line-height:.9;letter-spacing:.04em;
    background:linear-gradient(90deg,var(--cyan) 10%,#fff 50%,var(--mag) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(77,217,255,.0);position:relative}
  #logoWrap h1::after{content:"";position:absolute;inset:-30px -60px;background:radial-gradient(ellipse at center,rgba(77,217,255,.16),transparent 65%);z-index:-1;animation:glowPulse 2.6s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}
  #logoWrap .tag{font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.65em;font-size:13px;color:var(--mist);margin-top:14px;text-transform:uppercase}

  #pressEnter{margin-top:70px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:17px;letter-spacing:.35em;color:var(--white);
    opacity:0;animation:pressIn .8s ease 2.6s forwards, pressPulse 1.6s ease-in-out 3.4s infinite;text-transform:uppercase}
  @keyframes pressIn{to{opacity:1}}
  @keyframes pressPulse{0%,100%{opacity:1}50%{opacity:.25}}

  #splashStatus{position:absolute;bottom:34px;font-size:12px;color:var(--mist);letter-spacing:.15em;font-weight:300}

  /* ================= QUEST-ONLY BLOCK ================= */
  #blocked{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:var(--ink);padding:30px}
  #blocked.show{display:flex}
  #blocked .icon{font-size:52px;margin-bottom:22px;filter:drop-shadow(0 0 24px rgba(77,217,255,.5))}
  #blocked h2{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:30px;letter-spacing:.1em;margin-bottom:14px;
    background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
  #blocked p{color:var(--mist);max-width:400px;line-height:1.8;font-size:15px;font-weight:300}
  #blocked .url{margin-top:22px;padding:12px 20px;border:1px solid rgba(77,217,255,.3);border-radius:10px;color:var(--cyan);font-size:13px;direction:ltr;word-break:break-all}

  #sceneWrap{position:fixed;inset:0;z-index:1}
</style>
</head>
<body>

<div id="splash">
  <div class="stars" id="stars"></div>
  <div id="logoWrap">
    <div class="ring"></div><div class="ring r2"></div>
    <h1>NOVA<br>TOUCH</h1>
    <div class="tag">Mixed Reality Arcade</div>
  </div>
  <div id="pressEnter">— לחץ כדי להיכנס —</div>
  <div id="splashStatus">טוען…</div>
</div>

<div id="blocked">
  <div class="icon">🥽</div>
  <h2>META QUEST ONLY</h2>
  <p>המשחק הזה רץ אך ורק בתוך משקפי Meta Quest.<br>פתח את הכתובת הזו בדפדפן של הקסדה:</p>
  <div class="url" id="blockedUrl"></div>
</div>

<div id="sceneWrap"></div>

<script>
/* ============================================================
   NOVA TOUCH v2 — console-style MR arcade
   - Cinematic logo splash, single tap to enter (keeps the WebXR
     user-activation window: enterAR() is the click's 1st action)
   - HARD Quest gate: no immersive-ar support => blocked screen
   - Everything else lives IN VR: 3D logo intro, touchable 3D
     START button, countdown, floating score, 3D results panel
   ============================================================ */

const ROUND_SECONDS = 60;
const SPAWN_RADIUS = 1.55;
const POP_RADIUS = 0.17;
const BASE_SPEED = 0.38;
const COLORS = [
  { hex:'#4dd9ff', pts:10, weight:5 },
  { hex:'#ff4dd2', pts:10, weight:5 },
  { hex:'#a64dff', pts:15, weight:2.5 },
  { hex:'#ffd24d', pts:40, weight:1 }
];

let sceneReady=false, arSupported=null, entered=false;

/* starfield */
const starsEl = document.getElementById('stars');
for(let i=0;i<70;i++){
  const s=document.createElement('i');
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*3)+'s';
  s.style.width=s.style.height=(1+Math.random()*2)+'px';
  starsEl.appendChild(s);
}

const splash=document.getElementById('splash');
const splashStatus=document.getElementById('splashStatus');
const blocked=document.getElementById('blocked');
document.getElementById('blockedUrl').textContent = location.href;

/* ======== DIAGNOSTIC PANEL (v4 debug build) ======== */
const dbg=document.createElement('div');
dbg.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;max-height:42vh;overflow:auto;z-index:99;background:rgba(3,4,12,.92);border:1px solid rgba(77,217,255,.4);border-radius:10px;padding:10px 12px;font:12px/1.5 monospace;color:#8fe3ff;direction:ltr;text-align:left;white-space:pre-wrap';
document.body.appendChild(dbg);
function LOG(msg){ dbg.textContent += msg+'\n'; dbg.scrollTop=dbg.scrollHeight; }
LOG('[boot] page loaded @ '+location.host);
LOG('[boot] userAgent: '+navigator.userAgent.slice(0,90));
LOG('[boot] in iframe: '+(function(){try{return window.self!==window.top}catch(e){return true}})());
LOG('[boot] navigator.xr: '+(navigator.xr?'EXISTS':'MISSING'));
window.addEventListener('error', ev=>LOG('[ERROR] '+ev.message+' @'+(ev.filename||'').split('/').pop()+':'+ev.lineno));
window.addEventListener('unhandledrejection', ev=>LOG('[REJECT] '+(ev.reason&&ev.reason.message||ev.reason)));
['click','pointerup','touchend'].forEach(t=>document.addEventListener(t,e=>LOG('[tap] '+t+' on '+(e.target.id||e.target.tagName)),true));
/* ==================================================== */

function bestScore(){ return parseInt(localStorage.getItem('novaTouchBest')||'0',10); }
function saveBest(s){ if(s>bestScore()) localStorage.setItem('novaTouchBest',String(s)); }

/* ---- HARD GATE + background preload ----
   Note: inside an iframe (itch.io embed) XR support is masked by the
   host's permissions policy, so we never show the blocked screen
   there — the launcher (open full tab) handles it instead. ---- */
function gateFail(){
  if (typeof IN_IFRAME!=='undefined' && IN_IFRAME) return;
  if ((()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })()) return;
  splash.classList.add('hide'); blocked.classList.add('show');
}

if (navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-ar').then(ok=>{
    LOG('[xr] immersive-ar supported: '+ok);
    arSupported=ok; if(!ok) gateFail(); else refresh();
  }).catch(()=>{ arSupported=false; gateFail(); });
} else { arSupported=false; gateFail(); }

const AFRAME_SOURCES = [
  'https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.1/aframe.min.js',
  'https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe.min.js',
  'https://aframe.io/releases/1.7.1/aframe.min.js'
];
(function load(i){
  if(i>=AFRAME_SOURCES.length){ splashStatus.textContent='שגיאת טעינה — רענן את הדף'; return; }
  const s=document.createElement('script'); s.src=AFRAME_SOURCES[i];
  s.onload=()=>{ LOG('[aframe] loaded from: '+AFRAME_SOURCES[i].split('/')[2]+' v'+(window.AFRAME&&AFRAME.version)); buildScene(()=>{ sceneReady=true; LOG('[scene] READY'); refresh(); }); };
  s.onerror=()=>{ s.remove(); load(i+1); };
  document.head.appendChild(s);
})(0);

function refresh(){
  if (sceneReady && arSupported){ splashStatus.textContent=''; }
}

function unlockAudio(){
  try{ const C=window.AudioContext||window.webkitAudioContext; const c=new C(); c.resume(); window.__unlock=c; }catch(e){}
}

/* ---- iframe escape (itch.io & similar): WebXR is blocked inside
   cross-origin iframes unless the host grants xr-spatial-tracking.
   itch.io historically doesn't, so inside an iframe we show a
   launcher that opens the game in its own full top-level tab. ---- */
const IN_IFRAME = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
if (IN_IFRAME){
  const pe=document.getElementById('pressEnter');
  pe.textContent='— פתח במסך מלא כדי לשחק —';
}

/* on-screen error reporting so failures are never silent */
window.addEventListener('error', ev=>{
  splashStatus.textContent='שגיאה: '+(ev.message||'לא ידועה');
});

function tryEnter(){
  LOG('[enter] tryEnter: iframe='+IN_IFRAME+' sceneReady='+sceneReady+' arSupported='+arSupported+' entered='+entered);
  if (IN_IFRAME){
    // WebXR can't start inside the embed — relaunch top-level
    window.open(location.href, '_blank');
    return;
  }
  if (!sceneReady){ splashStatus.textContent='עוד רגע, טוען…'; return; }
  if (!arSupported || entered) return;
  entered=true; unlockAudio();
  try{
    LOG('[enter] calling scene.enterAR()...');
    const p=document.getElementById('scene').enterAR();
    if (p&&p.then) p.then(()=>LOG('[enter] enterAR resolved OK'));
    if (p&&p.catch) p.catch(err=>{ entered=false; LOG('[enter] enterAR REJECTED: '+err.name+': '+err.message); splashStatus.textContent='ה-Quest חסם כניסה: '+err.message; });
  }catch(err){
    entered=false; splashStatus.textContent='שגיאת כניסה: '+err.message;
  }
}
splash.addEventListener('click', tryEnter);
splash.addEventListener('pointerup', e=>{ e.preventDefault(); tryEnter(); });

/* ============ AUDIO ENGINE (procedural, no assets) ============ */
function createAudio(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain(); master.gain.value=0.4; master.connect(ctx.destination);
  const musicBus=ctx.createGain(); musicBus.gain.value=0.7; musicBus.connect(master);
  if (ctx.state==='suspended') ctx.resume();

  let musicTimer=null, step=0, intensity=0; // intensity 0..1 grows with combo
  const SCALE=[0,3,5,7,10]; const ROOT=110; // A minor pentatonic
  function n2f(semi){ return ROOT*Math.pow(2,semi/12); }

  function synth(freq,t0,dur,type,vol,filt){
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=freq;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filt;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(f); f.connect(g); g.connect(musicBus);
    o.start(t0); o.stop(t0+dur+0.05);
  }
  function startMusic(){
    if (musicTimer) return;
    const STEP=0.16; let next=ctx.currentTime+0.05;
    musicTimer=setInterval(()=>{
      while(next<ctx.currentTime+0.4){
        const bar=Math.floor(step/16);
        // bass
        if (step%4===0) synth(n2f(SCALE[bar%4===3?3:0])-0.5? n2f([0,0,5,3][bar%4]) /2 : 55, next, 0.3,'sawtooth',0.16,300+intensity*500);
        // arp
        const arpNote=SCALE[(step*2+bar)%SCALE.length]+12;
        synth(n2f(arpNote), next, 0.14,'square',0.035+intensity*0.05, 1200+intensity*2600);
        // hat
        if (step%2===1){
          const b=ctx.createBuffer(1,ctx.sampleRate*0.03,ctx.sampleRate); const d=b.getChannelData(0);
          for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
          const src=ctx.createBufferSource(); src.buffer=b;
          const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=8000;
          const g=ctx.createGain(); g.gain.value=0.05+intensity*0.06;
          src.connect(hp); hp.connect(g); g.connect(musicBus); src.start(next);
        }
        // kick
        if (step%8===0){
          const o=ctx.createOscillator(); o.type='sine';
          o.frequency.setValueAtTime(130,next); o.frequency.exponentialRampToValueAtTime(45,next+0.12);
          const g=ctx.createGain(); g.gain.setValueAtTime(0.4,next); g.gain.exponentialRampToValueAtTime(0.001,next+0.2);
          o.connect(g); g.connect(musicBus); o.start(next); o.stop(next+0.22);
        }
        next+=STEP; step++;
      }
    },90);
  }
  function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

  function sfxPop(comboN){
    const t0=ctx.currentTime, base=380+Math.min(comboN,20)*22;
    [0,4,7].forEach((s,i)=>{
      const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=base*Math.pow(2,s/12);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.14/(i+1),t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.18);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.2);
    });
  }
  function sfxGold(){
    const t0=ctx.currentTime;
    [0,4,7,12].forEach((s,i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=523*Math.pow(2,s/12);
      const g=ctx.createGain(); const st=t0+i*0.05;
      g.gain.setValueAtTime(0.16,st); g.gain.exponentialRampToValueAtTime(0.001,st+0.3);
      o.connect(g); g.connect(master); o.start(st); o.stop(st+0.32);
    });
  }
  function sfxMiss(){
    const t0=ctx.currentTime;
    const o=ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(150,t0); o.frequency.exponentialRampToValueAtTime(60,t0+0.28);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.14,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.3);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.32);
  }
  function sfxSting(){ // logo reveal
    const t0=ctx.currentTime;
    [0,7,12,19].forEach((s,i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=220*Math.pow(2,s/12);
      const g=ctx.createGain(); g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(0.12,t0+0.4+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.001,t0+2.2);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+2.3);
    });
  }
  function sfxCount(final){
    const t0=ctx.currentTime;
    const o=ctx.createOscillator(); o.type='square'; o.frequency.value=final?880:440;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.15,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+(final?0.5:0.15));
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+(final?0.55:0.2));
  }
  return { startMusic, stopMusic, sfxPop, sfxGold, sfxMiss, sfxSting, sfxCount, setIntensity:v=>intensity=Math.min(1,v) };
}

/* ============ SCENE ============ */
function buildScene(onReady){
  const THREE=AFRAME.THREE;

  /* --- canvas helpers: crisp game-style text & glows --- */
  function canvasTex(draw,w=256,h=256){
    const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
  }
  function textTex(text,{size=120,color='#ffffff',glow='rgba(77,217,255,.9)',font='Rajdhani',weight=700,w=1024,h=256}={}){
    return canvasTex((g)=>{
      g.clearRect(0,0,w,h);
      g.font=`${weight} ${size}px ${font},sans-serif`;
      g.textAlign='center'; g.textBaseline='middle';
      g.shadowColor=glow; g.shadowBlur=34;
      g.fillStyle=color; g.fillText(text,w/2,h/2);
      g.shadowBlur=14; g.fillText(text,w/2,h/2);
    },w,h);
  }
  const glowTex=canvasTex((g,w,h)=>{
    const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.65)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  });
  const ringGlowTex=canvasTex((g,w,h)=>{
    g.clearRect(0,0,w,h);
    const gr=g.createRadialGradient(w/2,h/2,w*0.30,w/2,h/2,w*0.5);
    gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.55,'rgba(255,255,255,.85)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  });

  const wrap=document.getElementById('sceneWrap');
  wrap.innerHTML=`
  <a-scene id="scene"
    webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
    xr-mode-ui="enabled: true; XRMode: ar"
    renderer="alpha: true; colorManagement: true; antialias: true; foveationLevel: 1"
    background="">
    <a-entity id="rig">
      <a-camera id="cam" position="0 1.6 0"></a-camera>
      <a-entity id="handL" hand-tracking-controls="hand: left; modelStyle: mesh; modelColor: #4dd9ff" meta-touch-controls="hand: left"></a-entity>
      <a-entity id="handR" hand-tracking-controls="hand: right; modelStyle: mesh; modelColor: #ff4dd2" meta-touch-controls="hand: right"></a-entity>
    </a-entity>
    <a-entity light="type: hemisphere; color: #eaf2ff; groundColor: #241c38; intensity: 1"></a-entity>
    <a-entity id="gameLight" light="type: point; color: #7fc9ff; intensity: 0; distance: 8; decay: 1.8" position="0 2.2 -1"></a-entity>
    <a-entity id="world"></a-entity>
  </a-scene>`;

  const scene=document.getElementById('scene');

  scene.addEventListener('loaded',()=>{
    const world=document.getElementById('world');
    const cam=document.getElementById('cam');
    const handL=document.getElementById('handL');
    const handR=document.getElementById('handR');
    const E=(tag,attrs,parent)=>{ const el=document.createElement(tag);
      for(const k in attrs) el.setAttribute(k,attrs[k]); (parent||world).appendChild(el); return el; };

    const V3=THREE.Vector3;
    const tmpQ=new THREE.Quaternion();
    function faceCam(el){ // billboard helper
      el.object3D.onBeforeRender=null;
      el.addEventListener('loaded',()=>{});
      el.object3D.userData.billboard=true;
    }
    // one global billboard pass
    const billboards=new Set();
    function addBillboard(el){ billboards.add(el); }
    function removeBillboard(el){ billboards.delete(el); }

    /* ---------- persistent glam: floor halo around player ---------- */
    const halo=E('a-entity',{position:'0 0.012 0'});
    const haloRing=E('a-plane',{rotation:'-90 0 0',width:'3.4',height:'3.4',
      material:'shader: flat; transparent: true; depthWrite: false; opacity: 0'},halo);
    haloRing.addEventListener('loaded',()=>{ const m=haloRing.getObject3D('mesh').material; m.map=ringGlowTex; m.color.set('#3fb7e8'); m.needsUpdate=true; });

    /* ============ GAME STATE ============ */
    let orbs=[], score=0, combo=0, maxCombo=0, timeLeft=ROUND_SECONDS;
    let phase='idle'; // idle | intro | menu | countdown | play | results
    let audio=null;
    let forwardYaw=0;

    /* ---------- 3D text sprite factory ---------- */
    function sprite(tex,w,h,parent,pos,opts={}){
      const el=E('a-plane',{width:w,height:h,position:pos||'0 0 0',
        material:'shader: flat; transparent: true; depthWrite: false'},parent);
      el.addEventListener('loaded',()=>{
        const m=el.getObject3D('mesh').material; m.map=tex;
        if(opts.color) m.color.set(opts.color);
        if(opts.opacity!==undefined) m.opacity=opts.opacity;
        m.needsUpdate=true;
      });
      return el;
    }

    /* ---------- IN-VR LOGO INTRO ---------- */
    let uiRoot=null;
    function clearUI(){ if(uiRoot){ uiRoot.remove(); uiRoot=null; } }

    function placeInFront(dist,height){
      const camPos=cam.object3D.getWorldPosition(new V3());
      const yaw=forwardYaw;
      return `${(camPos.x - Math.sin(yaw)*dist).toFixed(3)} ${height} ${(camPos.z - Math.cos(yaw)*dist).toFixed(3)}`;
    }

    function showLogoIntro(){
      phase='intro'; clearUI();
      const camRot=cam.object3D.rotation; forwardYaw=camRot.y;
      uiRoot=E('a-entity',{position:placeInFront(2.2,1.65),rotation:`0 ${(forwardYaw*180/Math.PI).toFixed(1)} 0`});

      const logo=sprite(textTex('NOVA TOUCH',{size:150,glow:'rgba(77,217,255,.95)',w:1600,h:340}),2.2,0.47,uiRoot,'0 0.15 0');
      logo.setAttribute('scale','0.001 0.001 0.001');
      logo.setAttribute('animation__in','property: scale; to: 1 1 1; dur: 1400; easing: easeOutElastic');
      const tag=sprite(textTex('MIXED REALITY ARCADE',{size:56,color:'#9fb3d8',glow:'rgba(255,77,210,.5)',w:1600,h:140}),1.7,0.15,uiRoot,'0 -0.18 0',{opacity:0});
      tag.setAttribute('animation__in','property: material.opacity; to: 0.9; dur: 900; delay: 900');

      // spinning neon rings behind logo
      [0.9,1.15].forEach((r,i)=>{
        const t=E('a-torus',{radius:r,'radius-tubular':0.006,position:'0 0.05 -0.06',
          material:`shader: flat; color: ${i?'#ff4dd2':'#4dd9ff'}; transparent: true; opacity: 0`,
          'segments-tubular':'50'},uiRoot);
        t.setAttribute('animation__in',`property: material.opacity; to: ${0.55-i*0.2}; dur: 1200; delay: ${300+i*200}`);
        t.setAttribute('animation__spin',`property: rotation; to: 0 0 ${i?-360:360}; dur: ${9000+i*4000}; loop: true; easing: linear`);
      });

      audio.sfxSting();
      const gl=document.getElementById('gameLight');
      gl.setAttribute('animation__on','property: light.intensity; to: 1.4; dur: 1500');
      haloRing.setAttribute('animation__in','property: material.opacity; to: 0.5; dur: 1600; delay: 400');

      setTimeout(showMenu, 3000);
    }

    /* ---------- 3D TOUCH BUTTON ---------- */
    const touchables=[]; // {el, pos(), r, onHit, cooldownUntil}
    function makeTouchButton(parent,pos,label,color,onHit,widthM=0.7){
      const btn=E('a-entity',{position:pos},parent);
      const bg=E('a-plane',{width:widthM,height:0.22,
        material:`shader: flat; color: #0a1020; transparent: true; opacity: 0.82`},btn);
      const frame=E('a-plane',{width:widthM+0.03,height:0.25,position:'0 0 -0.005',
        material:`shader: flat; color: ${color}; transparent: true; opacity: 0.9`},btn);
      sprite(textTex(label,{size:86,color:'#ffffff',glow:color+'e6',w:768,h:190}),widthM*0.92,0.18,btn,'0 0 0.006');
      // pulse to invite touching
      frame.setAttribute('animation__pulse','property: material.opacity; from: 0.9; to: 0.45; dir: alternate; dur: 700; loop: true');
      const rec={ el:btn, r:0.19, onHit, cooldownUntil:0 };
      touchables.push(rec);
      return btn;
    }
    function clearTouchables(){ touchables.length=0; }

    /* ---------- MENU (in VR) ---------- */
    function showMenu(){
      phase='menu'; clearUI(); clearTouchables();
      uiRoot=E('a-entity',{position:placeInFront(1.5,1.5),rotation:`0 ${(forwardYaw*180/Math.PI).toFixed(1)} 0`});
      sprite(textTex('NOVA TOUCH',{size:120,glow:'rgba(77,217,255,.95)',w:1400,h:280}),1.5,0.3,uiRoot,'0 0.42 0');
      const best=bestScore();
      if (best>0) sprite(textTex('BEST  '+best,{size:64,color:'#ffd24d',glow:'rgba(255,210,77,.7)',w:900,h:150}),0.85,0.14,uiRoot,'0 0.16 0');
      sprite(textTex('גע בכפתור כדי להתחיל',{size:56,color:'#9fb3d8',glow:'rgba(0,0,0,0)',font:'Heebo',weight:400,w:1200,h:140}),1.15,0.135,uiRoot,'0 -0.05 0',{opacity:0.85});
      makeTouchButton(uiRoot,'0 -0.32 0','START','#4dd9ff',()=>startCountdown());
    }

    /* ---------- COUNTDOWN ---------- */
    function startCountdown(){
      phase='countdown'; clearUI(); clearTouchables();
      uiRoot=E('a-entity',{position:placeInFront(1.6,1.6),rotation:`0 ${(forwardYaw*180/Math.PI).toFixed(1)} 0`});
      const seq=['3','2','1','GO!'];
      seq.forEach((txt,i)=>{
        setTimeout(()=>{
          uiRoot.innerHTML='';
          const isGo=txt==='GO!';
          const s=sprite(textTex(txt,{size:isGo?200:260,color:isGo?'#ffd24d':'#ffffff',
            glow:isGo?'rgba(255,210,77,.95)':'rgba(77,217,255,.9)',w:640,h:400}),isGo?1.15:0.75,isGo?0.72:0.47,uiRoot);
          s.setAttribute('scale','0.3 0.3 0.3');
          s.setAttribute('animation__in','property: scale; to: 1 1 1; dur: 300; easing: easeOutBack');
          s.setAttribute('animation__out','property: material.opacity; to: 0; dur: 250; delay: 650');
          audio.sfxCount(isGo);
          if (isGo) setTimeout(startRound, 700);
        }, i*1000);
      });
    }

    /* ---------- HUD (floating scoreboard) ---------- */
    let hud=null, hudScore=null, hudTime=null, hudCombo=null;
    let hudScoreTexEl=null;
    function buildHUD(){
      hud=E('a-entity',{position:placeInFront(2.0,2.25),rotation:`-12 ${(forwardYaw*180/Math.PI).toFixed(1)} 0`});
      E('a-plane',{width:'1.5',height:'0.34',material:'shader: flat; color: #060a18; transparent: true; opacity: 0.66'},hud);
      E('a-plane',{width:'1.53',height:'0.37',position:'0 0 -0.004',material:'shader: flat; color: #4dd9ff; transparent: true; opacity: 0.35'},hud);
      hudScore=E('a-entity',{position:'-0.45 0 0.006'},hud);
      hudTime =E('a-entity',{position:'0.5 0 0.006'},hud);
      hudCombo=E('a-entity',{position:'0.05 0 0.006'},hud);
      updateHUD(true);
    }
    let lastHudKey='';
    function updateHUD(force){
      if(!hud) return;
      const t=Math.max(0,Math.ceil(timeLeft));
      const key=score+'|'+combo+'|'+t;
      if(!force && key===lastHudKey) return; lastHudKey=key;
      hudScore.innerHTML=''; hudTime.innerHTML=''; hudCombo.innerHTML='';
      sprite(textTex(String(score),{size:120,color:'#ffffff',glow:'rgba(77,217,255,.85)',w:512,h:200}),0.45,0.175,hudScore);
      sprite(textTex('0:'+String(t).padStart(2,'0'),{size:100,color:t<=10?'#ff6a6a':'#cfe4ff',glow:t<=10?'rgba(255,80,80,.8)':'rgba(120,160,255,.5)',w:512,h:190}),0.4,0.15,hudTime);
      if (combo>=3) sprite(textTex('x'+combo,{size:90,color:'#ffd24d',glow:'rgba(255,210,77,.9)',w:400,h:170}),0.28,0.12,hudCombo);
    }

    /* ---------- ORBS ---------- */
    function pickColor(){
      const tw=COLORS.reduce((a,c)=>a+c.weight,0); let r=Math.random()*tw;
      for(const c of COLORS){ if(r<c.weight) return c; r-=c.weight; } return COLORS[0];
    }
    function spawnOrb(){
      const c=pickColor();
      const camPos=cam.object3D.getWorldPosition(new V3());
      const ang=forwardYaw+(Math.random()-0.5)*Math.PI*1.05;
      const h=0.95+Math.random()*1.0;
      const dist=SPAWN_RADIUS+Math.random()*0.4;
      const pos=new V3(camPos.x-Math.sin(ang)*dist, h, camPos.z-Math.cos(ang)*dist);
      const target=new V3(camPos.x, h*0.94, camPos.z);
      const dir=target.clone().sub(pos).normalize();

      const root=E('a-entity',{position:`${pos.x} ${pos.y} ${pos.z}`});
      // spawn portal flash
      const flash=E('a-plane',{width:'0.05',height:'0.05',material:'shader: flat; transparent: true; depthWrite: false'},root);
      flash.addEventListener('loaded',()=>{ const m=flash.getObject3D('mesh').material; m.map=ringGlowTex; m.color.set(c.hex); m.needsUpdate=true; });
      flash.setAttribute('animation__s','property: scale; to: 9 9 9; dur: 320; easing: easeOutQuad');
      flash.setAttribute('animation__o','property: material.opacity; from: 1; to: 0; dur: 320');
      addBillboard(flash);
      setTimeout(()=>{ removeBillboard(flash); flash.remove(); },360);

      // core + shell + glow + orbit ring
      const core=E('a-sphere',{radius:'0.055',material:`shader: flat; color: #ffffff`},root);
      const shell=E('a-sphere',{radius:'0.095','segments-width':'20','segments-height':'14',
        material:`color: ${c.hex}; metalness: 0.1; roughness: 0.25; transparent: true; opacity: 0.5; emissive: ${c.hex}; emissiveIntensity: 0.8`},root);
      const glow=E('a-plane',{width:'0.42',height:'0.42',material:'shader: flat; transparent: true; depthWrite: false'},root);
      glow.addEventListener('loaded',()=>{ const m=glow.getObject3D('mesh').material; m.map=glowTex; m.color.set(c.hex); m.opacity=0.6; m.needsUpdate=true; });
      addBillboard(glow);
      const orbit=E('a-torus',{radius:'0.135','radius-tubular':'0.004',
        material:`shader: flat; color: ${c.hex}; transparent: true; opacity: 0.85`},root);
      orbit.setAttribute('animation__spin',`property: rotation; to: ${Math.random()>0.5?360:-360} 360 0; dur: ${1800+Math.random()*1200}; loop: true; easing: linear`);
      root.setAttribute('animation__in','property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 240; easing: easeOutBack');
      if (c.pts>=40){ // gold: extra sparkle pulse
        shell.setAttribute('animation__pulse','property: material.emissiveIntensity; from: 0.8; to: 1.6; dir: alternate; dur: 300; loop: true');
      }
      orbs.push({root,glow,pos,dir,pts:c.pts,hex:c.hex,gold:c.pts>=40,popped:false,
        speed:BASE_SPEED*(0.9+Math.random()*0.35)});
    }

    function popBurst(pos,hex,pts){
      const g=E('a-entity',{position:`${pos.x} ${pos.y} ${pos.z}`});
      const ring=E('a-plane',{width:'0.06',height:'0.06',material:'shader: flat; transparent: true; depthWrite: false'},g);
      ring.addEventListener('loaded',()=>{ const m=ring.getObject3D('mesh').material; m.map=ringGlowTex; m.color.set(hex); m.needsUpdate=true; });
      ring.setAttribute('animation__s','property: scale; to: 12 12 12; dur: 300; easing: easeOutQuad');
      ring.setAttribute('animation__o','property: material.opacity; from: 1; to: 0; dur: 300');
      addBillboard(ring);
      for(let i=0;i<9;i++){
        const a=Math.random()*Math.PI*2, el2=(Math.random()-0.35)*Math.PI*0.6, sp=0.5+Math.random()*0.9;
        const d=E('a-box',{position:'0 0 0',width:'0.022',height:'0.022',depth:'0.022',
          material:`shader: flat; color: ${hex}; transparent: true; opacity: 1`},g);
        const dx=Math.cos(a)*Math.cos(el2)*sp, dy=Math.sin(el2)*sp+0.25, dz=Math.sin(a)*Math.cos(el2)*sp;
        d.setAttribute('animation__p',`property: position; to: ${dx*0.4} ${dy*0.4-0.3} ${dz*0.4}; dur: 420; easing: easeOutQuad`);
        d.setAttribute('animation__o','property: material.opacity; to: 0; dur: 420');
      }
      // floating score popup
      const pop=sprite(textTex('+'+pts,{size:110,color:pts>=40?'#ffd24d':'#ffffff',glow:(pts>=40?'rgba(255,210,77,':'rgba(77,217,255,')+'0.9)',w:380,h:190}),0.22,0.11,g,'0 0.1 0');
      addBillboard(pop);
      pop.setAttribute('animation__up','property: position; to: 0 0.34 0; dur: 600; easing: easeOutQuad');
      pop.setAttribute('animation__o','property: material.opacity; to: 0; dur: 600; delay: 150');
      setTimeout(()=>{ removeBillboard(ring); removeBillboard(pop); g.remove(); },700);
    }

    /* ---------- ROUND FLOW ---------- */
    let spawnTimer=0;
    function startRound(){
      clearUI(); clearTouchables();
      orbs.forEach(o=>o.root.remove()); orbs=[];
      score=0; combo=0; maxCombo=0; timeLeft=ROUND_SECONDS; spawnTimer=0.2;
      audio.setIntensity(0); audio.startMusic();
      if(!hud) buildHUD(); updateHUD(true);
      phase='play';
    }
    function endRound(){
      phase='results';
      audio.stopMusic();
      orbs.forEach(o=>o.root.remove()); orbs=[];
      saveBest(score);
      if (hud){ hud.remove(); hud=null; }
      clearUI(); clearTouchables();
      uiRoot=E('a-entity',{position:placeInFront(1.6,1.55),rotation:`0 ${(forwardYaw*180/Math.PI).toFixed(1)} 0`});
      E('a-plane',{width:'1.45',height:'1.0',material:'shader: flat; color: #060a18; transparent: true; opacity: 0.8'},uiRoot);
      E('a-plane',{width:'1.49',height:'1.04',position:'0 0 -0.004',material:'shader: flat; color: #ff4dd2; transparent: true; opacity: 0.4'},uiRoot);
      sprite(textTex('ROUND COMPLETE',{size:70,color:'#9fb3d8',glow:'rgba(77,217,255,.5)',w:1100,h:150}),1.05,0.14,uiRoot,'0 0.36 0.006');
      sprite(textTex(String(score),{size:250,color:'#ffffff',glow:'rgba(255,210,77,.95)',w:800,h:330}),0.85,0.35,uiRoot,'0 0.05 0.006');
      sprite(textTex('BEST '+bestScore()+'    MAX COMBO x'+maxCombo,{size:56,color:'#ffd24d',glow:'rgba(255,210,77,.6)',w:1200,h:130}),1.05,0.115,uiRoot,'0 -0.22 0.006');
      makeTouchButton(uiRoot,'0 -0.42 0.006','PLAY AGAIN','#4dd9ff',()=>startCountdown(),0.8);
    }

    /* ---------- MAIN LOOP ---------- */
    let lastT=performance.now();
    scene.addEventListener('renderstart',()=>{
      scene.renderer.setAnimationLoop((time)=>{
        const dt=Math.min((time-lastT)/1000,0.05); lastT=time;
        const camObj=cam.object3D;
        const camPos=camObj.getWorldPosition(new V3());
        camObj.getWorldQuaternion(tmpQ);
        billboards.forEach(el=>{ if(el.object3D) el.object3D.quaternion.copy(tmpQ); });
        halo.object3D.position.set(camPos.x,0.012,camPos.z);

        const lPos=handL.object3D.getWorldPosition(new V3());
        const rPos=handR.object3D.getWorldPosition(new V3());

        /* touch buttons (menu / results) */
        if (touchables.length){
          const now=performance.now();
          for(const t of touchables){
            if (now<t.cooldownUntil) continue;
            const bp=t.el.object3D.getWorldPosition(new V3());
            if (bp.distanceTo(lPos)<t.r || bp.distanceTo(rPos)<t.r){
              t.cooldownUntil=now+800;
              audio.sfxPop(1);
              t.onHit();
              break;
            }
          }
        }

        if (phase==='play'){
          timeLeft-=dt; spawnTimer-=dt;
          const maxOrbs=4+Math.floor((ROUND_SECONDS-timeLeft)/15); // ramps 4→8
          if (spawnTimer<=0 && orbs.length<maxOrbs){
            spawnOrb();
            spawnTimer=Math.max(0.32, 0.7 - (ROUND_SECONDS-timeLeft)*0.006)+Math.random()*0.3;
          }
          for(let i=orbs.length-1;i>=0;i--){
            const o=orbs[i];
            o.pos.addScaledVector(o.dir,o.speed*dt);
            o.root.object3D.position.copy(o.pos);
            const dL=o.pos.distanceTo(lPos), dR=o.pos.distanceTo(rPos);
            if (dL<POP_RADIUS||dR<POP_RADIUS){
              combo++; maxCombo=Math.max(maxCombo,combo);
              const mult=1+Math.floor(combo/5)*0.5;
              score+=Math.round(o.pts*mult);
              audio.setIntensity(combo/15);
              o.gold?audio.sfxGold():audio.sfxPop(combo);
              popBurst(o.pos,o.hex,Math.round(o.pts*mult));
              o.root.remove(); orbs.splice(i,1); updateHUD();
              continue;
            }
            if (o.pos.distanceTo(camPos)<0.22){
              combo=0; audio.setIntensity(0); audio.sfxMiss();
              o.root.remove(); orbs.splice(i,1); updateHUD();
            }
          }
          updateHUD();
          if (timeLeft<=0) endRound();
        }
      });
    });

    /* ---------- SESSION ---------- */
    scene.addEventListener('enter-vr',()=>{
      LOG('[session] enter-vr fired!');
      splash.classList.add('hide');
      audio=createAudio();
      setTimeout(showLogoIntro,600);
    });
    scene.addEventListener('exit-vr',()=>{
      phase='idle'; entered=false;
      if (audio) audio.stopMusic();
      orbs.forEach(o=>o.root.remove()); orbs=[];
      if(hud){hud.remove();hud=null;}
      clearUI(); clearTouchables();
      splash.classList.remove('hide');
    });

    if (onReady) onReady();
  });
}
</script>
</body>
</html>
