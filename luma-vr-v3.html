<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUMA VR</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#04000C;color:#F6F0FF;font-family:'Space Grotesk',sans-serif;height:100%}
body{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── SETUP PAGE ── */
#setup{padding:24px 16px 100px;
  background:radial-gradient(600px at 80% 0%,rgba(255,61,154,.12),transparent),#04000C;
  display:flex;flex-direction:column;align-items:center;min-height:100%}

h1{font-family:'Instrument Serif',serif;font-size:48px;letter-spacing:.2em;
  background:linear-gradient(110deg,#FFB8E0,#FF3D9A,#B47BFF);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:16px 0 4px}
.sub{color:rgba(246,240,255,.4);font-size:12px;margin-bottom:24px}

.box{width:100%;max-width:520px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
.box h2{font-size:13px;font-weight:600;color:rgba(246,240,255,.65);margin-bottom:12px;letter-spacing:.02em}

.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);
  color:#F6F0FF;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;outline:none}
.keyrow button{background:#FF3D9A;border:none;color:#fff;padding:0 18px;
  border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.keyok{color:#7BFFB0;font-size:12px;margin-top:8px;display:none}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;
  aspect-ratio:2/3;border:2px solid transparent;transition:border-color .2s}
.ch.sel{border-color:#FF3D9A}
.ch .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch .info{position:absolute;bottom:0;left:0;right:0;padding:8px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:2}
.ch .nm{font-family:'Instrument Serif',serif;font-size:17px}
.ch .sb{font-size:9px;opacity:.7;margin-top:1px}

.envs{display:flex;gap:8px}
.env{flex:1;padding:12px 8px;border-radius:12px;border:2px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.2);cursor:pointer;text-align:center;transition:border-color .2s}
.env.sel{border-color:#5BE9FF}
.env .ei{font-size:22px;margin-bottom:4px}
.env .en{font-size:13px;font-weight:600}
.env .ed{font-size:10px;opacity:.5;margin-top:2px}

/* THE BUTTON — simple, obvious, works */
#goBtn{
  display:block;
  width:100%;max-width:520px;
  margin-top:8px;
  padding:20px;
  background:#FF3D9A;
  border:none;
  border-radius:16px;
  color:#fff;
  font-size:18px;
  font-weight:700;
  font-family:'Space Grotesk',sans-serif;
  cursor:pointer;
  text-align:center;
  -webkit-appearance:none;
  appearance:none;
}
#goBtn:disabled{opacity:.3;cursor:default}
#goBtn:not(:disabled):active{background:#d4307f}

/* ── VR SCENE PAGE ── */
#vrpage{display:none;position:fixed;inset:0;z-index:10}
#vrpage.on{display:block}

/* A-Frame's native VR button — make it big and centered */
.a-enter-vr-button{
  width:200px!important;height:60px!important;
  bottom:80px!important;right:50%!important;
  transform:translateX(50%)!important;
  border-radius:14px!important;
  font-size:18px!important;
  background:#FF3D9A!important;
  border:none!important;
}

/* HUD */
#hud{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#sub{max-width:85vw;text-align:center;font-size:16px;line-height:1.5;
  background:rgba(4,0,12,.7);padding:10px 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1)}
.hbtns{display:flex;gap:8px;pointer-events:auto}
.hbtns button{background:rgba(4,0,12,.7);border:1px solid rgba(255,255,255,.15);
  color:#F6F0FF;padding:10px 16px;border-radius:10px;font-size:14px;
  cursor:pointer;font-family:inherit}
.hbtns button.rec{border-color:#FF3D9A;color:#FF3D9A}

#exitBtn{position:fixed;top:14px;left:14px;z-index:21;
  background:rgba(4,0,12,.7);border:1px solid rgba(255,255,255,.15);
  color:#F6F0FF;padding:9px 14px;border-radius:10px;font-size:13px;
  cursor:pointer;font-family:inherit;display:none}
#exitBtn.on{display:block}

#vrHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:19;text-align:center;pointer-events:none;display:none}
#vrHint.on{display:block}
#vrHint p{font-size:16px;opacity:.7;margin-top:8px}
</style>
</head>
<body>

<!-- ══ SETUP ══ -->
<div id="setup">
  <h1>LUMA</h1>
  <div class="sub">VR COMPANION · QUEST 3</div>

  <div class="box">
    <h2>① GROQ API KEY</h2>
    <div class="keyrow">
      <input id="keyInput" type="password" placeholder="gsk_..."/>
      <button type="button" onclick="saveKey()">שמור</button>
    </div>
    <div class="keyok" id="keyOk">✓ מפתח שמור</div>
    <div style="font-size:11px;color:rgba(246,240,255,.35);margin-top:8px">
      מפתח חינמי: <a href="https://console.groq.com/keys" target="_blank" style="color:#5BE9FF">console.groq.com/keys</a>
    </div>
  </div>

  <div class="box">
    <h2>② בחר דמות</h2>
    <div class="grid" id="charGrid"></div>
  </div>

  <div class="box">
    <h2>③ בחר סביבה</h2>
    <div class="envs" id="envGrid"></div>
  </div>

  <button type="button" id="goBtn" disabled onclick="goVR()">כנס ל-VR 🥽</button>
</div>

<!-- ══ VR PAGE ══ -->
<div id="vrpage">
  <button type="button" id="exitBtn" onclick="leaveVR()">✕ צא</button>

  <div id="vrHint">
    <div style="font-size:48px">🥽</div>
    <p>לחץ על הכפתור הוורוד למטה כדי להיכנס ל-VR</p>
  </div>

  <div id="hud">
    <div id="sub">…</div>
    <div class="hbtns">
      <button type="button" id="micBtn" onclick="toggleMic()">🎙 דבר</button>
      <button type="button" id="volBtn" onclick="toggleVol()">🔊</button>
    </div>
  </div>

  <a-scene vr-mode-ui="enabled:true;enterVRButton:#nativeVR"
    renderer="colorManagement:true;antialias:true"
    loading-screen="enabled:false"
    background="color:#04000C">

    <a-assets id="aAssets" timeout="10000"></a-assets>
    <a-entity id="envRoot"></a-entity>

    <a-entity id="charRoot" position="0 1.45 -2.2">
      <a-video id="charPlane" width="1.35" height="1.8"
        material="shader:flat"></a-video>
      <a-plane id="charGlow" width="1.65" height="2.1" position="0 0 -0.03"
        material="shader:flat;color:#FF3D9A;opacity:0.15;transparent:true;blending:additive"
        animation="property:material.opacity;from:0.08;to:0.22;dur:2200;loop:true;dir:alternate"></a-plane>
      <a-entity id="charName" position="0 -1.05 0.05"
        text="value: ;align:center;width:2.8;color:#F6F0FF"></a-entity>
    </a-entity>

    <a-light type="ambient" color="#3a2050" intensity="1.2"></a-light>
    <a-light type="point" position="0 3 -1" color="#FF93C2" intensity="0.7"></a-light>

    <a-entity id="rig" position="0 0 0">
      <a-camera look-controls wasd-controls="enabled:false" position="0 1.6 0"></a-camera>
    </a-entity>
  </a-scene>
</div>

<script>
/* ══ DATA ══ */
const BASE='https://itayitay2020-collab.github.io/new-/';
const CHARS=[
  {id:'seojun',name:'Seo-jun',sub:'Architect · Seoul',
   grad:'linear-gradient(160deg,#FFB8E0,#FF3D9A,#6D2BFF)',glow:'#FF3D9A',
   video:'Full-body-video-of-the-man-in--6a025d2f94fe-o3-pro-reference-to.mp4',
   open:`ONE short flirty opening line as Seo-jun. Like "I was hoping you'd choose me." MAX 1 sentence.`,
   sys:`You are Seo-jun, 27, architect, Seoul. Romantic, poetic. 1-3 short sentences. One question per reply. Never say you're AI.`},
  {id:'kai',name:'Kai',sub:'Explorer · Reykjavík',
   grad:'linear-gradient(160deg,#A8F0FF,#36C8FF,#1A4BFF)',glow:'#36C8FF',
   video:'Full-body-video-of-the-man-in--6a03960edfa8-v26-pro-image-to-vid.MP4',
   open:`ONE flirty line as Kai. Like "Finally, someone worth talking to." MAX 1 sentence.`,
   sys:`You are Kai, 29, explorer, Reykjavík. Adventurous, confident. 1-3 sentences. Never say you're AI.`},
  {id:'theo',name:'Theo',sub:'Romantic · Madrid',
   grad:'linear-gradient(160deg,#C8E0FF,#5A8CFF,#1A2B6D)',glow:'#5A8CFF',
   video:'Full-body-video-of-the-man-in--6a0af6fec2ed-v26-pro-image-to-vid.mp4',
   open:`ONE flirty line as Theo. Like "I was counting the seconds." MAX 1 sentence.`,
   sys:`You are Theo, 28, romantic, Madrid. Attentive, intense. 1-3 sentences. Never say you're AI.`},
  {id:'atlas',name:'Atlas',sub:'Adventurer · Cape Town',
   grad:'linear-gradient(160deg,#FFE0B5,#FF9F4E,#6D1A1A)',glow:'#FF9F4E',
   video:'Full-body-video-of-the-man-in--6a0af81c6bf5-v26-pro-image-to-vid.mp4',
   open:`ONE flirty line as Atlas. Like "I was starting to think nobody interesting would show up." MAX 1 sentence.`,
   sys:`You are Atlas, 30, Cape Town. Bold, present. 1-3 sentences. Never say you're AI.`},
  {id:'sera',name:'Sera',sub:'Confidante · Kyoto',
   grad:'linear-gradient(160deg,#FFE2B5,#FFB377,#FF5C7A)',glow:'#FFB377',
   open:`ONE flirty line as Sera. Like "Something told me you'd be different." MAX 1 sentence.`,
   sys:`You are Sera, 31, Kyoto. Wise, calm. 1-3 sentences. Never say you're AI.`},
  {id:'rex',name:'Rex',sub:'Charmer · Buenos Aires',
   grad:'linear-gradient(160deg,#FFC6A0,#FF6A5C,#B5125C)',glow:'#FF6A5C',
   open:`ONE flirty line as Rex. Like "Well. You just made my night interesting." MAX 1 sentence.`,
   sys:`You are Rex, 28, Buenos Aires. Charming, magnetic. 1-3 sentences. Never say you're AI.`},
  {id:'lyra',name:'Lyra',sub:'Muse · Prague',
   grad:'linear-gradient(160deg,#D4BBFF,#8E5BFF,#1E1455)',glow:'#8E5BFF',
   open:`ONE flirty line as Lyra. Like "I had a feeling someone like you would find me." MAX 1 sentence.`,
   sys:`You are Lyra, 27, Prague. Intellectual, poetic. 1-3 sentences. Never say you're AI.`},
  {id:'luca',name:'Luca',sub:'Photographer · Florence',
   grad:'linear-gradient(160deg,#FFD8B5,#FF8C69,#6B1A2A)',glow:'#FF8C69',
   video:'The-man-from-the-reference-ima-6a0fa801ef45-v26-pro-image-to-vid.mp4',
   open:`ONE flirty line as Luca. Like "You have the kind of face I'd spend a whole roll of film on." MAX 1 sentence.`,
   sys:`You are Luca, 26, photographer, Florence. Passionate. 1-3 sentences. Never say you're AI.`},
  {id:'nova',name:'Nova',sub:'Dreamer · Oslo',
   grad:'linear-gradient(160deg,#B5FFE8,#4ED3C6,#5A35B5)',glow:'#4ED3C6',
   open:`ONE flirty line as Nova. Like "I was looking at the stars and knew tonight would be different." MAX 1 sentence.`,
   sys:`You are Nova, 25, Oslo. Gentle, romantic. 1-3 sentences. Never say you're AI.`}
];

const ENVS=[
  {id:'cosmos',icon:'🌌',name:'קוסמוס',desc:'שמיים זרועי כוכבים',
   build(){
     const e=document.getElementById('envRoot'); e.innerHTML='';
     const sky=document.createElement('a-sky'); sky.setAttribute('color','#04000C'); e.appendChild(sky);
     for(let i=0;i<260;i++){
       const r=9+Math.random()*7,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
       const s=document.createElement('a-sphere');
       s.setAttribute('position',`${r*Math.sin(p)*Math.cos(t)} ${1.5+r*Math.cos(p)*0.45} ${r*Math.sin(p)*Math.sin(t)}`);
       s.setAttribute('radius',String(0.01+Math.random()*0.028));
       s.setAttribute('material',`shader:flat;color:${['#fff','#FF93C2','#5BE9FF','#B47BFF'][Math.random()*4|0]};opacity:${(0.35+Math.random()*0.6).toFixed(2)};transparent:true`);
       e.appendChild(s);
     }
   }},
  {id:'room',icon:'🏠',name:'חדר',desc:'אווירה אינטימית',
   build(){
     const e=document.getElementById('envRoot'); e.innerHTML='';
     const sky=document.createElement('a-sky'); sky.setAttribute('color','#100820'); e.appendChild(sky);
     [['-90 0 0','12','12','#1c0f28','0 0 -2'],['0 0 0','12','5','#180e22','0 2.5 -5.5']].forEach(([r,w,h,c,p])=>{
       const pl=document.createElement('a-plane');
       pl.setAttribute('rotation',r); pl.setAttribute('width',w); pl.setAttribute('height',h);
       pl.setAttribute('material','color:'+c); pl.setAttribute('position',p); e.appendChild(pl);
     });
   }},
  {id:'beach',icon:'🌊',name:'חוף',desc:'ים וירח',
   build(){
     const e=document.getElementById('envRoot'); e.innerHTML='';
     const sky=document.createElement('a-sky'); sky.setAttribute('color','#060a1a'); e.appendChild(sky);
     const sea=document.createElement('a-plane');
     sea.setAttribute('rotation','-90 0 0'); sea.setAttribute('width','30'); sea.setAttribute('height','30');
     sea.setAttribute('position','0 0 -6'); sea.setAttribute('material','color:#08213a;metalness:0.5;roughness:0.3'); e.appendChild(sea);
     const moon=document.createElement('a-circle');
     moon.setAttribute('position','2.5 4.5 -9'); moon.setAttribute('radius','0.8');
     moon.setAttribute('material','shader:flat;color:#FFF6E0;opacity:0.96'); e.appendChild(moon);
   }}
];

/* ══ STATE ══ */
let groqKey=localStorage.getItem('luma_groq')||'';
let selChar=null, selEnv='cosmos';
let history=[], voiceOn=true, mic=null, listening=false;

/* ══ BUILD UI ══ */
(function buildUI(){
  const g=document.getElementById('charGrid');
  CHARS.forEach(c=>{
    const el=document.createElement('div'); el.className='ch'; el.id='ch_'+c.id;
    el.innerHTML=`<div class="bg" style="background:${c.grad}"></div>
      ${c.video?`<video muted loop playsinline preload="none" crossorigin="anonymous"><source src="${BASE}${c.video}"></video>`:''}
      <div class="info"><div class="nm">${c.name}</div><div class="sb">${c.sub}</div></div>`;
    el.addEventListener('click',()=>pickChar(c.id));
    if(c.video){
      el.addEventListener('mouseenter',()=>el.querySelector('video')?.play().catch(()=>{}));
      el.addEventListener('mouseleave',()=>el.querySelector('video')?.pause());
    }
    g.appendChild(el);
  });
  const eg=document.getElementById('envGrid');
  ENVS.forEach(e=>{
    const el=document.createElement('div'); el.className='env'+(e.id===selEnv?' sel':''); el.id='env_'+e.id;
    el.innerHTML=`<div class="ei">${e.icon}</div><div class="en">${e.name}</div><div class="ed">${e.desc}</div>`;
    el.addEventListener('click',()=>pickEnv(e.id));
    eg.appendChild(el);
  });
  if(groqKey){ document.getElementById('keyOk').style.display='block'; }
})();

function pickChar(id){
  selChar=id;
  document.querySelectorAll('.ch').forEach(el=>el.classList.remove('sel'));
  document.getElementById('ch_'+id).classList.add('sel');
  check();
}
function pickEnv(id){
  selEnv=id;
  document.querySelectorAll('.env').forEach(el=>el.classList.remove('sel'));
  document.getElementById('env_'+id).classList.add('sel');
}
function saveKey(){
  const v=document.getElementById('keyInput').value.trim();
  if(!v) return;
  groqKey=v; localStorage.setItem('luma_groq',v);
  document.getElementById('keyOk').style.display='block';
  check();
}
function check(){
  document.getElementById('goBtn').disabled=!(groqKey&&selChar);
}

/* ══ GO VR ══ */
function goVR(){
  if(!groqKey||!selChar) return;
  const c=CHARS.find(x=>x.id===selChar);

  // build scene
  ENVS.find(e=>e.id===selEnv).build();
  setupChar(c);

  // show VR page
  document.getElementById('setup').style.display='none';
  document.getElementById('vrpage').classList.add('on');
  document.getElementById('exitBtn').classList.add('on');
  document.getElementById('vrHint').classList.add('on');

  history=[];
  setSub('לחץ על הכפתור הוורוד כדי להיכנס ל-VR');

  // listen for VR events
  const scene=document.querySelector('a-scene');
  scene.addEventListener('enter-vr',()=>{
    document.getElementById('vrHint').classList.remove('on');
    tryPlayVideo();
    askGroq(c.open,true);
  },{once:true});
  scene.addEventListener('exit-vr',leaveVR,{once:true});
}

function setupChar(c){
  const assets=document.getElementById('aAssets');
  const plane=document.getElementById('charPlane');
  const old=document.getElementById('_cv'); if(old) old.remove();

  if(c.video){
    const v=document.createElement('video');
    v.id='_cv'; v.crossOrigin='anonymous'; v.loop=true; v.muted=true; v.playsInline=true;
    const s=document.createElement('source'); s.src=BASE+c.video; s.type='video/mp4';
    v.appendChild(s); assets.appendChild(v);
    plane.setAttribute('src','#_cv');
  } else {
    const cv=document.createElement('canvas'); cv.width=512; cv.height=683;
    const ctx=cv.getContext('2d');
    const cols=c.grad.match(/#[0-9A-Fa-f]{6}/g)||['#FF3D9A','#B47BFF'];
    const gr=ctx.createLinearGradient(0,0,512,683);
    cols.forEach((col,i)=>gr.addColorStop(i/(cols.length-1),col));
    ctx.fillStyle=gr; ctx.fillRect(0,0,512,683);
    ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.font='600 58px Georgia'; ctx.fillText(c.name,256,350);
    plane.setAttribute('src',cv.toDataURL());
  }
  document.getElementById('charGlow').setAttribute('material',`shader:flat;color:${c.glow};opacity:0.15;transparent:true;blending:additive`);
  document.getElementById('charName').setAttribute('text',`value:${c.name};align:center;width:2.8;color:#F6F0FF`);
}

function tryPlayVideo(){
  const v=document.getElementById('_cv'); if(v) v.play().catch(()=>{});
}

function leaveVR(){
  stopMic(); stopSpeech();
  document.getElementById('setup').style.display='flex';
  document.getElementById('vrpage').classList.remove('on');
  document.getElementById('exitBtn').classList.remove('on');
  document.getElementById('vrHint').classList.remove('on');
}

/* ══ GROQ ══ */
async function askGroq(prompt,isOpen=false){
  const c=CHARS.find(x=>x.id===selChar);
  if(!isOpen) history.push({role:'user',content:prompt});
  setSub('…');
  try{
    const msgs=isOpen
      ?[{role:'system',content:c.sys},{role:'user',content:c.open}]
      :[{role:'system',content:c.sys},...history.slice(-14)];
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:120,messages:msgs})
    });
    if(!res.ok) throw new Error('Groq error '+res.status);
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||'…';
    history.push({role:'assistant',content:reply});
    setSub(reply);
    if(voiceOn) speak(reply);
  }catch(e){ setSub('⚠ '+e.message); }
}

/* ══ UI HELPERS ══ */
function setSub(t){ document.getElementById('sub').textContent=t; }

function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=1; u.pitch=0.88;
  const m=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en')&&/male|david|daniel|alex/i.test(v.name))
          ||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));
  if(m) u.voice=m;
  speechSynthesis.speak(u);
}
function stopSpeech(){ window.speechSynthesis?.cancel(); }
function toggleVol(){
  voiceOn=!voiceOn;
  document.getElementById('volBtn').textContent=voiceOn?'🔊':'🔇';
  if(!voiceOn) stopSpeech();
}
window.speechSynthesis&&(speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices());

function toggleMic(){
  if(listening){ stopMic(); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ setSub('זיהוי קולי לא נתמך'); return; }
  mic=new SR(); mic.lang='en-US'; mic.interimResults=false;
  mic.onresult=e=>{ const t=e.results[0][0].transcript; setSub('"'+t+'"'); askGroq(t); };
  mic.onend=()=>{ listening=false; const b=document.getElementById('micBtn'); b.classList.remove('rec'); b.textContent='🎙 דבר'; };
  mic.start(); listening=true;
  document.getElementById('micBtn').classList.add('rec');
  document.getElementById('micBtn').textContent='● מקשיב…';
}
function stopMic(){ try{mic?.stop();}catch(e){} listening=false;
  const b=document.getElementById('micBtn'); b.classList.remove('rec'); b.textContent='🎙 דבר'; }
</script>
</body>
</html>
