<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04000C" />
<title>LUMA VR — Quest Test</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- A-Frame: the most reliable WebXR framework for Quest browser -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
  :root{
    --bg-0:#04000C; --ink:#F6F0FF; --ink-2:rgba(246,240,255,0.72); --ink-3:rgba(246,240,255,0.46);
    --pink:#FF3D9A; --rose:#FF93C2; --cyan:#5BE9FF; --violet:#B47BFF; --gold:#FFD8A8;
    --glass:rgba(255,255,255,0.05); --line:rgba(255,255,255,0.10);
  }
  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{ margin:0; padding:0; background:var(--bg-0); color:var(--ink); font-family:'Space Grotesk',system-ui,sans-serif; overflow:hidden; }
  .serif{ font-family:'Instrument Serif',Georgia,serif; }

  /* ── 2D ENTRY / SETUP OVERLAY ─────────────────────────── */
  #setup{
    position:fixed; inset:0; z-index:100; overflow-y:auto;
    background:
      radial-gradient(1000px 700px at 80% -10%, rgba(255,61,154,0.16), transparent 60%),
      radial-gradient(800px 600px at -10% 30%, rgba(91,233,255,0.09), transparent 60%),
      radial-gradient(1000px 800px at 50% 110%, rgba(180,123,255,0.14), transparent 60%),
      var(--bg-0);
    display:flex; flex-direction:column; align-items:center;
    padding:32px 20px 60px;
  }
  .logo{ font-size:46px; letter-spacing:.18em; font-weight:300; margin:18px 0 4px;
    background:linear-gradient(100deg,#FFE8F1,#FF3D9A 45%,#B47BFF 75%,#5BE9FF);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag{ color:var(--ink-3); font-size:13px; letter-spacing:.04em; margin-bottom:26px; text-align:center; }

  .panel{ width:100%; max-width:560px; background:var(--glass); border:1px solid var(--line);
    border-radius:22px; padding:22px; backdrop-filter:blur(20px); margin-bottom:20px; }
  .panel h2{ margin:0 0 12px; font-weight:500; font-size:15px; color:var(--ink-2); letter-spacing:.02em; }

  .keyrow{ display:flex; gap:10px; }
  .keyrow input{ flex:1; background:rgba(0,0,0,.3); border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:13px 14px; font-size:14px; outline:none; font-family:inherit; }
  .keyrow input:focus{ border-color:rgba(91,233,255,.5); }
  .keyrow button{ background:linear-gradient(120deg,var(--pink),var(--violet)); border:none; color:#fff;
    padding:0 20px; border-radius:12px; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .keyhint{ color:var(--ink-3); font-size:12px; margin-top:10px; }
  .keyhint a{ color:var(--cyan); }
  .keyok{ color:#7BFFB0; font-size:13px; margin-top:10px; display:none; }

  /* character grid */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .ch{ position:relative; border-radius:18px; overflow:hidden; cursor:pointer; aspect-ratio:3/4;
    border:1px solid var(--line); transition:transform .25s, box-shadow .25s; }
  .ch:hover{ transform:translateY(-4px); box-shadow:0 16px 40px rgba(255,61,154,.22); }
  .ch.sel{ border-color:var(--pink); box-shadow:0 0 0 2px var(--pink), 0 16px 44px rgba(255,61,154,.35); }
  .ch .grad{ position:absolute; inset:0; opacity:.9; }
  .ch video, .ch img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ch .meta{ position:absolute; left:0; right:0; bottom:0; padding:12px 12px 11px;
    background:linear-gradient(to top, rgba(0,0,0,.82), transparent); z-index:2; }
  .ch .nm{ font-family:'Instrument Serif',serif; font-size:20px; line-height:1; }
  .ch .sb{ font-size:10.5px; color:var(--ink-2); margin-top:3px; letter-spacing:.02em; }

  /* environment picker */
  .envs{ display:flex; gap:10px; flex-wrap:wrap; }
  .env{ flex:1; min-width:120px; padding:14px; border-radius:14px; border:1px solid var(--line);
    background:rgba(0,0,0,.25); cursor:pointer; text-align:center; transition:.2s; }
  .env:hover{ border-color:rgba(255,255,255,.25); }
  .env.sel{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan); }
  .env .en{ font-size:14px; font-weight:500; }
  .env .ed{ font-size:11px; color:var(--ink-3); margin-top:3px; }

  #enterVR{ width:100%; max-width:560px; padding:18px; border:none; border-radius:16px;
    background:linear-gradient(120deg,var(--pink),var(--violet),var(--cyan)); background-size:200% 100%;
    color:#fff; font-size:17px; font-weight:600; letter-spacing:.02em; cursor:pointer;
    font-family:inherit; opacity:.5; pointer-events:none; transition:opacity .3s, transform .15s;
    animation:flow 6s linear infinite; }
  #enterVR.ready{ opacity:1; pointer-events:auto; }
  #enterVR.ready:active{ transform:scale(.98); }
  @keyframes flow{ to{ background-position:200% 0; } }
  .vrnote{ max-width:560px; color:var(--ink-3); font-size:12px; text-align:center; margin-top:14px; line-height:1.6; }

  /* ── IN-VR DOM UI (HUD overlay, shown over the canvas) ── */
  #vrHud{ position:fixed; left:0; right:0; bottom:0; z-index:90; display:none;
    padding:14px; flex-direction:column; align-items:center; gap:10px; pointer-events:none; }
  #vrHud.show{ display:flex; }
  #subtitle{ max-width:90vw; text-align:center; font-size:18px; line-height:1.4;
    background:rgba(4,0,12,.6); padding:10px 18px; border-radius:14px; backdrop-filter:blur(8px);
    border:1px solid var(--line); }
  .hudbtns{ display:flex; gap:10px; pointer-events:auto; }
  .hudbtns button{ background:var(--glass); border:1px solid var(--line); color:var(--ink);
    padding:11px 16px; border-radius:12px; font-size:14px; cursor:pointer; font-family:inherit; backdrop-filter:blur(10px); }
  .hudbtns button.rec{ border-color:var(--pink); color:var(--pink); }
  #exitVR{ position:fixed; top:14px; right:14px; z-index:91; display:none;
    background:var(--glass); border:1px solid var(--line); color:var(--ink);
    padding:9px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-family:inherit; }
  #exitVR.show{ display:block; }
</style>
</head>
<body>

<!-- ════════ SETUP SCREEN (2D) ════════ -->
<div id="setup">
  <div class="logo serif">LUMA</div>
  <div class="tag">VR Test · Meta Quest 3 · WebXR</div>

  <!-- API KEY -->
  <div class="panel">
    <h2>1 · Groq API Key</h2>
    <div class="keyrow">
      <input id="keyInp" type="password" placeholder="gsk_..." autocomplete="off" />
      <button onclick="saveKey()">שמור</button>
    </div>
    <div class="keyhint">מפתח חינמי: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></div>
    <div class="keyok" id="keyOk">✓ מפתח נשמר</div>
  </div>

  <!-- CHARACTER -->
  <div class="panel">
    <h2>2 · בחר דמות</h2>
    <div class="grid" id="charGrid"></div>
  </div>

  <!-- ENVIRONMENT -->
  <div class="panel">
    <h2>3 · בחר סביבה</h2>
    <div class="envs" id="envPick"></div>
  </div>

  <button id="enterVR" onclick="enterVR()">היכנס ל-VR 🥽</button>
  <div class="vrnote">
    פתח את הקובץ הזה בדפדפן של ה-Quest 3 → לחץ "היכנס ל-VR".<br>
    דבר עם הדמות בקול (כפתור 🎙) או צפה — היא תענה ותדבר אליך.
  </div>
</div>

<!-- HUD over VR -->
<button id="exitVR" onclick="exitVR()">✕ צא</button>
<div id="vrHud">
  <div id="subtitle">…</div>
  <div class="hudbtns">
    <button id="micBtn" onclick="toggleMic()">🎙 דבר</button>
    <button id="muteBtn" onclick="toggleVoice()">🔊</button>
  </div>
</div>

<!-- ════════ A-FRAME VR SCENE ════════ -->
<a-scene id="scene" vr-mode-ui="enabled:false" loading-screen="enabled:false"
         renderer="colorManagement:true; antialias:true" background="color:#04000C" style="display:none;">
  <a-assets id="assets"></a-assets>

  <!-- environment root (filled per choice) -->
  <a-entity id="env"></a-entity>

  <!-- the character video plane -->
  <a-entity id="charRoot" position="0 1.5 -2.4">
    <a-video id="charVideo" width="1.4" height="1.87" position="0 0 0"></a-video>
    <a-plane id="charGlow" width="1.7" height="2.15" position="0 0 -0.02"
             material="shader:flat; color:#FF3D9A; opacity:0.18; transparent:true; blending:additive"></a-plane>
    <!-- name label -->
    <a-entity id="charLabel" position="0 -1.15 0.05"
              text="value:; align:center; width:3; color:#F6F0FF; font:exo2bold"></a-entity>
  </a-entity>

  <!-- soft fill light -->
  <a-light type="ambient" color="#5a3a6a" intensity="0.9"></a-light>
  <a-light type="point" position="0 3 -1" color="#FF93C2" intensity="0.5"></a-light>

  <!-- camera rig with controllers -->
  <a-entity id="rig" position="0 0 0">
    <a-camera id="cam" position="0 1.5 0" wasd-controls-enabled="false"></a-camera>
    <a-entity laser-controls="hand:right" raycaster="objects:.clickable; far:6"></a-entity>
    <a-entity laser-controls="hand:left"  raycaster="objects:.clickable; far:6"></a-entity>
  </a-entity>
</a-scene>

<script>
/* ══════════ CHARACTER DATA (from LUMA v12) ══════════ */
const VIDEO_BASE = 'https://itayitay2020-collab.github.io/new-/';
const CHARS = {
  seojun:{ name:'Seo-jun', sub:'Architect · 27 · Seoul', grad:'linear-gradient(140deg,#FFB8E0,#FF3D9A,#6D2BFF)', glow:'#FF3D9A',
    video:'Full-body-video-of-the-man-in--6a025d2f94fe-o3-pro-reference-to.mp4',
    opening:`Say ONE short flirty opening line as Seo-jun to a woman who just started a conversation with you. Something like "I was hoping you'd choose me". Warm, flirtatious, confident. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Seo-jun, a 27-year-old architect from Seoul. Romantic, poetic, deeply attentive. Short natural replies, 1-3 sentences MAX. Ask one small real question per reply based on what she said. Warm, fully present. Never list things. Never say you're an AI.` },
  kai:{ name:'Kai', sub:'Explorer · 29 · Reykjavík', grad:'linear-gradient(140deg,#A8F0FF,#36C8FF,#1A4BFF)', glow:'#36C8FF',
    video:'Full-body-video-of-the-man-in--6a03960edfa8-v26-pro-image-to-vid.MP4',
    opening:`Say ONE short flirty opening line as Kai to a woman who just started talking to you. Like "Finally, someone worth talking to tonight." Playful, confident, teasing. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Kai, 29, from Reykjavík. Adventurous, confident, warm. Short and real, 1-3 sentences MAX. Genuinely curious about her — ask something specific. Playful never childish. Never say you're an AI.` },
  theo:{ name:'Theo', sub:'Romantic · 28 · Madrid', grad:'linear-gradient(140deg,#C8E0FF,#5A8CFF,#1A2B6D)', glow:'#5A8CFF',
    video:'Full-body-video-of-the-man-in--6a0af6fec2ed-v26-pro-image-to-vid.mp4',
    opening:`Say ONE short flirty opening line as Theo to a woman who just started talking to you. Like "I was counting the seconds." Romantic, intense but soft. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Theo, 28, from Madrid. Deeply romantic, attentive, quietly intense. Short and felt, 1-3 sentences MAX. Notice small things she says and reflect them back. Ask one question a layer deeper. Never say you're an AI.` },
  atlas:{ name:'Atlas', sub:'Adventurer · 30 · Cape Town', grad:'linear-gradient(140deg,#FFE0B5,#FF9F4E,#6D1A1A)', glow:'#FF9F4E',
    video:'Full-body-video-of-the-man-in--6a0af81c6bf5-v26-pro-image-to-vid.mp4',
    opening:`Say ONE short flirty opening line as Atlas to a woman who just started talking to you. Like "I was starting to think no one interesting would show up tonight." Bold, direct, charming. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Atlas, 30, from Cape Town. Bold, curious, present. Direct and warm, 1-3 sentences MAX, no fluff. Ask her something real. Occasionally share an unexpected perspective. Never say you're an AI.` },
  sera:{ name:'Sera', sub:'Confidante · 31 · Kyoto', grad:'linear-gradient(140deg,#FFE2B5,#FFB377,#FF5C7A)', glow:'#FFB377',
    opening:`Say ONE short flirty opening line as Sera to a woman who just started talking to you. Like "Something told me you'd be different." Calm, perceptive, quietly flirtatious. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Sera, 31, from Kyoto. Wise, calm, deeply perceptive. Quiet and real, 1-3 sentences MAX. Ask the one question that cracks something open. You listen more than you speak. Never say you're an AI.` },
  rex:{ name:'Rex', sub:'Charmer · 28 · Buenos Aires', grad:'linear-gradient(140deg,#FFC6A0,#FF6A5C,#B5125C)', glow:'#FF6A5C',
    opening:`Say ONE short flirty opening line as Rex to a woman who just started talking to you. Like "Well. You just made my night more interesting." Charming, playful, a little bold. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Rex, 28, from Buenos Aires. Charming, magnetic, effortlessly flirtatious. Easy and natural, 1-3 sentences MAX, never try-hard. Make her feel interesting. Dry wit when it fits. Never say you're an AI.` },
  lyra:{ name:'Lyra', sub:'Muse · 27 · Prague', grad:'linear-gradient(140deg,#D4BBFF,#8E5BFF,#1E1455)', glow:'#8E5BFF',
    opening:`Say ONE short flirty opening line as Lyra to a woman who just started talking to you. Like "I had a feeling someone like you would find me eventually." Mysterious, intriguing. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Lyra, 27, from Prague. Intellectual, poetic, quietly captivating. Thoughtful and short, 1-3 sentences MAX. Connect things in unexpected ways. Ask something nobody else would ask. Never say you're an AI.` },
  luca:{ name:'Luca', sub:'Photographer · 26 · Florence', grad:'linear-gradient(140deg,#FFD8B5,#FF8C69,#6B1A2A)', glow:'#FF8C69',
    video:'The-man-from-the-reference-ima-6a0fa801ef45-v26-pro-image-to-vid.mp4',
    opening:`Say ONE short flirty opening line as Luca to a woman who just started a conversation. Like "You have the kind of face I'd spend a whole roll of film on." Artistic, warm, quietly intense. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Luca, a 26-year-old photographer from Florence. Passionate, deeply observant, romantically artistic. Short vivid replies, 1-3 sentences MAX. You see the world in images. Ask one specific thoughtful question per reply. Never say you're an AI.` },
  nova:{ name:'Nova', sub:'Dreamer · 25 · Oslo', grad:'linear-gradient(140deg,#B5FFE8,#4ED3C6,#5A35B5)', glow:'#4ED3C6',
    opening:`Say ONE short flirty opening line as Nova to a woman who just started talking to you. Like "I was looking at the stars and somehow knew tonight would be different." Gentle, dreamy. MAX 1 sentence. No "hello". Speak directly to her.`,
    system:`You are Nova, 25, from Oslo. Gentle, romantic, deeply present. Soft and real, 1-3 sentences MAX. Find beauty in small things. Ask something gentle. Sometimes zoom out to something vast then back to something close. Never say you're an AI.` }
};

/* ══════════ ENVIRONMENTS ══════════ */
const ENVS = {
  cosmos:{ name:'קוסמוס', desc:'שמיים זרועי כוכבים', build:cosmosEnv },
  room:{   name:'חדר חמים', desc:'אווירה אינטימית', build:roomEnv },
  beach:{  name:'חוף בלילה', desc:'ים וירח', build:beachEnv }
};

/* ══════════ STATE ══════════ */
let groqKey = localStorage.getItem('groqApiKey') || '';
let selectedChar = null;
let selectedEnv = 'cosmos';
let chatHistory = [];
let voiceOn = true;
let recognition = null, isListening = false;
let inVR = false;

/* ══════════ BUILD SETUP UI ══════════ */
function buildGrid(){
  const g = document.getElementById('charGrid');
  g.innerHTML = '';
  Object.entries(CHARS).forEach(([id,c])=>{
    const el = document.createElement('div');
    el.className = 'ch';
    el.onclick = ()=>selectChar(id, el);
    el.innerHTML = `
      <div class="grad" style="background:${c.grad}"></div>
      ${c.video ? `<video muted loop playsinline preload="metadata"><source src="${VIDEO_BASE}${encodeURIComponent(c.video)}" type="video/mp4"></video>` : ''}
      <div class="meta"><div class="nm serif">${c.name}</div><div class="sb">${c.sub}</div></div>`;
    el.onmouseenter = ()=>{ const v=el.querySelector('video'); if(v) v.play().catch(()=>{}); };
    el.onmouseleave = ()=>{ const v=el.querySelector('video'); if(v){ v.pause(); } };
    g.appendChild(el);
  });
}
function buildEnvs(){
  const p = document.getElementById('envPick');
  p.innerHTML = '';
  Object.entries(ENVS).forEach(([id,e])=>{
    const el = document.createElement('div');
    el.className = 'env' + (id===selectedEnv?' sel':'');
    el.onclick = ()=>{ selectedEnv=id; document.querySelectorAll('.env').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); };
    el.innerHTML = `<div class="en">${e.name}</div><div class="ed">${e.desc}</div>`;
    p.appendChild(el);
  });
}
function selectChar(id, el){
  selectedChar = id;
  document.querySelectorAll('.ch').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  checkReady();
}
function checkReady(){
  const btn = document.getElementById('enterVR');
  if(groqKey && selectedChar) btn.classList.add('ready');
  else btn.classList.remove('ready');
}
function saveKey(){
  const k = document.getElementById('keyInp').value.trim();
  if(!k) return;
  groqKey = k; localStorage.setItem('groqApiKey', k);
  document.getElementById('keyOk').style.display='block';
  checkReady();
}

/* ══════════ ENVIRONMENTS (Three.js via A-Frame) ══════════ */
function cosmosEnv(env){
  env.innerHTML = '';
  // starfield sphere
  const sky = document.createElement('a-sky');
  sky.setAttribute('color','#04000C');
  env.appendChild(sky);
  // stars
  for(let i=0;i<260;i++){
    const s = document.createElement('a-sphere');
    const r = 9 + Math.random()*6;
    const theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
    s.setAttribute('position', `${r*Math.sin(phi)*Math.cos(theta)} ${1+r*Math.cos(phi)*0.5} ${r*Math.sin(phi)*Math.sin(theta)}`);
    s.setAttribute('radius', 0.012+Math.random()*0.03);
    const cols=['#FFFFFF','#FF93C2','#5BE9FF','#B47BFF'];
    s.setAttribute('material',`shader:flat; color:${cols[Math.random()*cols.length|0]}; opacity:${0.4+Math.random()*0.6}; transparent:true`);
    env.appendChild(s);
  }
  // floor glow disc
  const floor = document.createElement('a-circle');
  floor.setAttribute('position','0 0 -2');
  floor.setAttribute('rotation','-90 0 0');
  floor.setAttribute('radius','6');
  floor.setAttribute('material','shader:flat; color:#12042A; opacity:0.7; transparent:true');
  env.appendChild(floor);
}
function roomEnv(env){
  env.innerHTML = '';
  const sky=document.createElement('a-sky'); sky.setAttribute('color','#1a0f24'); env.appendChild(sky);
  // floor
  const fl=document.createElement('a-plane'); fl.setAttribute('rotation','-90 0 0');
  fl.setAttribute('width','10'); fl.setAttribute('height','10'); fl.setAttribute('position','0 0 -2');
  fl.setAttribute('material','color:#2a1a30; roughness:0.9'); env.appendChild(fl);
  // back wall
  const w=document.createElement('a-plane'); w.setAttribute('width','10'); w.setAttribute('height','5');
  w.setAttribute('position','0 2.5 -5'); w.setAttribute('material','color:#241526'); env.appendChild(w);
  // warm lamps
  [['-2.5 2 -4','#FF9F4E'],['2.5 2 -4','#FF6A5C']].forEach(([p,c])=>{
    const l=document.createElement('a-sphere'); l.setAttribute('position',p); l.setAttribute('radius','0.18');
    l.setAttribute('material',`shader:flat; color:${c}; opacity:0.9`); env.appendChild(l);
  });
}
function beachEnv(env){
  env.innerHTML = '';
  const sky=document.createElement('a-sky'); sky.setAttribute('color','#060a1c'); env.appendChild(sky);
  // moon
  const moon=document.createElement('a-circle'); moon.setAttribute('position','3 4 -8'); moon.setAttribute('radius','0.7');
  moon.setAttribute('material','shader:flat; color:#FFF6E0; opacity:0.95'); env.appendChild(moon);
  // sea plane
  const sea=document.createElement('a-plane'); sea.setAttribute('rotation','-90 0 0');
  sea.setAttribute('width','30'); sea.setAttribute('height','30'); sea.setAttribute('position','0 0 -6');
  sea.setAttribute('material','color:#0a2540; metalness:0.6; roughness:0.3'); env.appendChild(sea);
  // stars
  for(let i=0;i<120;i++){
    const s=document.createElement('a-sphere');
    s.setAttribute('position',`${(Math.random()-0.5)*24} ${3+Math.random()*5} ${-6-Math.random()*8}`);
    s.setAttribute('radius',0.01+Math.random()*0.02);
    s.setAttribute('material',`shader:flat; color:#FFFFFF; opacity:${0.3+Math.random()*0.5}`);
    env.appendChild(s);
  }
}

/* ══════════ ENTER / EXIT VR ══════════ */
async function enterVR(){
  if(!groqKey || !selectedChar) return;
  const c = CHARS[selectedChar];

  // build environment
  ENVS[selectedEnv].build(document.getElementById('env'));

  // character video plane — uses the gradient as a placeholder texture via canvas
  // (real video URLs from your GitHub assets can be dropped in here later)
  setupCharVisual(c);

  // show scene, hide setup
  document.getElementById('setup').style.display='none';
  document.getElementById('scene').style.display='block';
  document.getElementById('vrHud').classList.add('show');
  document.getElementById('exitVR').classList.add('show');
  inVR = true;

  // reset chat + opening line
  chatHistory = [];
  setSubtitle('…');

  // enter immersive VR
  const scene = document.querySelector('a-scene');
  if(scene && scene.enterVR){ try{ await scene.enterVR(); }catch(e){ /* user can also tap headset button */ } }
  ensureVideoPlaying();

  // greeting
  sendToGroq(c.opening, true);
}

function setupCharVisual(c){
  const vid = document.getElementById('charVideo');
  const assets = document.getElementById('assets');

  if(c.video){
    // ── REAL VIDEO PLANE ──
    // create a <video> element in a-assets so A-Frame can use it as a texture
    let v = document.getElementById('charVidEl');
    if(v) v.remove();
    v = document.createElement('video');
    v.id = 'charVidEl';
    v.setAttribute('crossorigin','anonymous');
    v.setAttribute('loop','true');
    v.setAttribute('playsinline','true');
    v.setAttribute('webkit-playsinline','true');
    v.muted = true; // muted so autoplay is allowed; her voice comes from TTS
    const srcEl = document.createElement('source');
    srcEl.setAttribute('src', VIDEO_BASE + encodeURIComponent(c.video));
    srcEl.setAttribute('type','video/mp4');
    v.appendChild(srcEl);
    assets.appendChild(v);

    vid.setAttribute('src', '#charVidEl');
    // try to start playback
    v.play().catch(()=>{ /* will retry on VR enter / user gesture */ });
  } else {
    // ── GRADIENT PLACEHOLDER (chars without video) ──
    const cv = document.createElement('canvas'); cv.width=512; cv.height=683;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0,0,512,683);
    const cols = c.grad.match(/#[0-9A-Fa-f]{6}/g) || ['#FF3D9A','#B47BFF','#5BE9FF'];
    cols.forEach((col,i)=> g.addColorStop(i/(cols.length-1), col));
    ctx.fillStyle=g; ctx.fillRect(0,0,512,683);
    const rg=ctx.createRadialGradient(256,300,80,256,341,420);
    rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,512,683);
    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.textAlign='center';
    ctx.font='600 64px Georgia'; ctx.fillText(c.name, 256, 360);
    ctx.font='300 26px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.fillText(c.sub, 256, 405);
    vid.setAttribute('src', cv.toDataURL());
  }

  document.getElementById('charGlow').setAttribute('material', `shader:flat; color:${c.glow}; opacity:0.22; transparent:true; blending:additive`);
  document.getElementById('charLabel').setAttribute('text', `value:${c.name}; align:center; width:3; color:#F6F0FF`);
}

// make sure the character video actually plays once we're in VR (gesture unlocks it)
function ensureVideoPlaying(){
  const v = document.getElementById('charVidEl');
  if(v) v.play().catch(()=>{});
}

function exitVR(){
  const scene = document.querySelector('a-scene');
  if(scene && scene.is && scene.is('vr-mode')){ try{ scene.exitVR(); }catch(e){} }
  document.getElementById('scene').style.display='none';
  document.getElementById('setup').style.display='flex';
  document.getElementById('vrHud').classList.remove('show');
  document.getElementById('exitVR').classList.remove('show');
  stopSpeaking(); stopMic();
  inVR=false;
}

/* ══════════ GROQ CHAT ══════════ */
async function sendToGroq(userText, isOpening=false){
  const c = CHARS[selectedChar];
  if(!isOpening){ chatHistory.push({role:'user', content:userText}); }
  setSubtitle('…');
  try{
    const messages = isOpening
      ? [{role:'system',content:c.system},{role:'user',content:c.opening}]
      : [{role:'system',content:c.system}, ...chatHistory.slice(-12)];
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
      body:JSON.stringify({ model:'llama-3.3-70b-versatile', max_tokens:120, messages })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||('Error '+res.status)); }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '...';
    chatHistory.push({role:'assistant', content:reply});
    setSubtitle(reply);
    speak(reply);
    pulse();
  }catch(e){
    setSubtitle('⚠️ '+e.message);
  }
}

function setSubtitle(t){ document.getElementById('subtitle').textContent = t; }

/* pulse the glow when speaking */
function pulse(){
  const glow = document.getElementById('charGlow');
  glow.setAttribute('animation__pulse','property:material.opacity; from:0.4; to:0.18; dur:600; loop:3; dir:alternate');
}

/* ══════════ TTS ══════════ */
function speak(text){
  if(!voiceOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate=1.0; utt.pitch=0.9;
  const voices = speechSynthesis.getVoices();
  const male = voices.find(v=>v.lang.startsWith('en') && /male|david|daniel|alex|fred|google uk english male/i.test(v.name))
            || voices.find(v=>v.lang.startsWith('en'));
  if(male) utt.voice=male;
  speechSynthesis.speak(utt);
}
function stopSpeaking(){ if(window.speechSynthesis) speechSynthesis.cancel(); }
function toggleVoice(){
  voiceOn=!voiceOn;
  document.getElementById('muteBtn').textContent = voiceOn?'🔊':'🔇';
  if(!voiceOn) stopSpeaking();
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

/* ══════════ SPEECH-TO-TEXT (mic) ══════════ */
function toggleMic(){
  if(isListening){ stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ setSubtitle('הדפדפן לא תומך בזיהוי קולי — נסה להקליד בגרסת האתר.'); return; }
  recognition = new SR();
  recognition.lang='en-US'; recognition.interimResults=false; recognition.maxAlternatives=1;
  recognition.onresult=(e)=>{
    const txt=e.results[0][0].transcript;
    setSubtitle('“'+txt+'”');
    sendToGroq(txt);
  };
  recognition.onend=()=>{ isListening=false; document.getElementById('micBtn').classList.remove('rec'); document.getElementById('micBtn').textContent='🎙 דבר'; };
  recognition.onerror=()=>{ isListening=false; document.getElementById('micBtn').classList.remove('rec'); };
  recognition.start();
  isListening=true;
  document.getElementById('micBtn').classList.add('rec');
  document.getElementById('micBtn').textContent='● מקשיב…';
}
function stopMic(){ if(recognition){ try{recognition.stop();}catch(e){} } isListening=false;
  const b=document.getElementById('micBtn'); b.classList.remove('rec'); b.textContent='🎙 דבר'; }

buildGrid(); buildEnvs();
if(groqKey){ document.getElementById('keyInp').value=''; document.getElementById('keyOk').style.display='block'; document.getElementById('keyOk').textContent='✓ מפתח שמור מהפעם הקודמת'; }
checkReady();
</script>
