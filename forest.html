<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>קַרַחַת — חוויית יער במציאות מעורבת</title>
<style>
  :root{
    --canopy:#2f5d3a;
    --canopy-deep:#1c3d26;
    --sky:#bfe0e8;
    --bark:#6b4a2f;
    --terracotta:#c4683f;
    --cream:#f3ecdd;
    --gold:#f4c66a;
    --ink:#1b241d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--canopy-deep);overflow:hidden;font-family:"Heebo","Assistant",system-ui,sans-serif;color:var(--cream)}
  canvas{display:block}

  #overlay{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(244,198,106,.18), transparent 60%),
      linear-gradient(180deg, #1c3d26 0%, #14291b 100%);
    transition:opacity .8s ease;
  }
  .leaf-mark{
    width:54px;height:54px;margin-bottom:22px;opacity:.95;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));
  }
  .eyebrow{
    font-size:13px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);opacity:.85;margin-bottom:14px;font-weight:600;
  }
  h1{
    font-size:clamp(38px,9vw,72px);line-height:.96;font-weight:800;
    letter-spacing:-.01em;margin-bottom:18px;
    color:var(--cream);
  }
  h1 .sub{display:block;font-size:.34em;font-weight:500;letter-spacing:.04em;color:#cdbf9f;margin-top:14px}
  p.lead{max-width:30ch;font-size:16px;line-height:1.7;color:#d8cdb4;margin-bottom:34px}
  button#enter{
    appearance:none;border:none;cursor:pointer;
    font-family:inherit;font-size:18px;font-weight:700;color:var(--ink);
    padding:18px 40px;border-radius:999px;
    background:linear-gradient(180deg,#f6d489,#e8b659);
    box-shadow:0 12px 30px rgba(232,182,89,.32),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button#enter:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(232,182,89,.42)}
  button#enter:active{transform:translateY(0)}
  button#enter:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  .hint{margin-top:22px;font-size:13px;color:#9fb0a0;max-width:34ch;line-height:1.6}
  #msg{
    margin-top:18px;font-size:14px;color:#f0b9a0;min-height:20px;max-width:36ch;line-height:1.6;
  }
  .steps{margin-top:30px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:380px}
  .step{flex:1 1 90px;min-width:90px}
  .step .n{font-size:12px;color:var(--gold);letter-spacing:.3em;font-weight:700}
  .step .t{font-size:13px;color:#c7bca3;margin-top:6px;line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="overlay">
  <svg class="leaf-mark" viewBox="0 0 24 24" fill="none">
    <path d="M12 2C7 6 4 10 4 15a8 8 0 0 0 16 0c0-5-3-9-8-13Z" fill="#7bbf86"/>
    <path d="M12 6v13" stroke="#1c3d26" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M12 11l3-2M12 14l-3-2" stroke="#1c3d26" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <div class="eyebrow">מציאות מעורבת · Quest</div>
  <h1>קַרַחַת<span class="sub">התקרה נפתחת אל היער</span></h1>
  <p class="lead">השארו במקומכם. הגג ייפתח לאט, אור יזרום פנימה, ומעל ראשכם יתגלה חורש שקט עם ציפורים.</p>
  <button id="enter">פתיחת היער</button>
  <div id="msg"></div>
  <div class="steps">
    <div class="step"><div class="n">۰۱</div><div class="t">לחצו "פתיחת היער"</div></div>
    <div class="step"><div class="n">۰۲</div><div class="t">אשרו גישה לחדר הסרוק</div></div>
    <div class="step"><div class="n">۰۳</div><div class="t">הביטו מעלה</div></div>
  </div>
  <div class="hint">דורש Meta Quest 3 / 3S עם דפדפן Horizon. אם החדר לא נסרק עדיין — תופיע בקשה לסרוק אותו פעם אחת.</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';

const overlay = document.getElementById('overlay');
const enterBtn = document.getElementById('enter');
const msg = document.getElementById('msg');

let renderer, scene, camera, refSpace;
let world;                 // group holding all forest content
let lid, lidMat;           // animated ceiling that opens
let beam, roofRim, birds = [], trees = [];
let ceilingY = 2.55;       // updated from detected plane
let ceilingFound = false;
let lidBuilt = false;
let openT = 0;             // 0..1 opening animation
const clock = new THREE.Clock();

// ---------- entry ----------
if(!navigator.xr){
  msg.textContent = "הדפדפן הזה לא תומך ב-WebXR. פתחו את הקובץ בדפדפן Horizon על הקווסט.";
}
enterBtn.addEventListener('click', startXR);

async function startXR(){
  msg.textContent = "";
  if(!navigator.xr){ msg.textContent="אין תמיכת WebXR בדפדפן הזה."; return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){ msg.textContent="מצב מציאות מעורבת (immersive-ar) לא נתמך כאן."; return; }

  let session;
  try{
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['plane-detection','mesh-detection','anchors','hit-test']
    });
  }catch(e){
    msg.textContent = "לא ניתן לפתוח סשן: " + (e.message||e);
    return;
  }
  initScene();
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  refSpace = renderer.xr.getReferenceSpace();
  overlay.style.opacity = '0';
  setTimeout(()=>overlay.style.display='none', 800);
  session.addEventListener('end', ()=>{ overlay.style.display='flex'; overlay.style.opacity='1'; });
  renderer.setAnimationLoop(render);
}

// ---------- scene ----------
function initScene(){
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 200);

  world = new THREE.Group();
  scene.add(world);

  // warm pastoral light
  const hemi = new THREE.HemisphereLight(0xdff0ff, 0x2f4a2e, 1.15);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0cf, 1.4);
  sun.position.set(3, 12, 2);
  scene.add(sun);

  buildSky();
  buildForest();
  buildBirds();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// soft gradient sky dome, sits high above the room
function buildSky(){
  const geo = new THREE.SphereGeometry(60, 32, 20);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ top:{value:new THREE.Color(0x8fc4d8)}, bot:{value:new THREE.Color(0xf3ecd0)} },
    vertexShader:`varying float h; void main(){ h=normalize(position).y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying float h; uniform vec3 top; uniform vec3 bot;
      void main(){ float t=clamp(h*1.1+0.25,0.0,1.0); gl_FragColor=vec4(mix(bot,top,t),1.0);} `
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.position.y = 6;
  world.add(sky);
}

function makeTree(h){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08*h, 0.12*h, h, 6),
    new THREE.MeshStandardMaterial({color:0x6b4a2f, roughness:1})
  );
  trunk.position.y = h/2;
  g.add(trunk);
  const greens = [0x3f7a4a, 0x2f5d3a, 0x4d8c54];
  for(let i=0;i<3;i++){
    const r = (0.9 - i*0.22)*h*0.6;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(r, h*0.7, 7),
      new THREE.MeshStandardMaterial({color:greens[i%3], roughness:1, flatShading:true})
    );
    cone.position.y = h*0.75 + i*h*0.32;
    g.add(cone);
  }
  return g;
}

// ring of trees + ground above the ceiling, so looking up reveals a clearing
function buildForest(){
  const grove = new THREE.Group();
  const N = 26;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2 + Math.random()*0.18;
    const rad = 4.2 + Math.random()*4.5;
    const h = 3.2 + Math.random()*3.4;
    const t = makeTree(h);
    t.position.set(Math.cos(a)*rad, 0, Math.sin(a)*rad);
    t.rotation.y = Math.random()*Math.PI;
    t.userData.sway = Math.random()*Math.PI*2;
    grove.add(t);
    trees.push(t);
  }
  // mossy ground ring (with a hole in the middle for the opening)
  const ground = new THREE.Mesh(
    new THREE.RingGeometry(1.4, 16, 48),
    new THREE.MeshStandardMaterial({color:0x3a6b3e, roughness:1, side:THREE.DoubleSide})
  );
  ground.rotation.x = -Math.PI/2;
  grove.add(ground);
  grove.userData.isGrove = true;
  world.add(grove);
  world.userData.grove = grove;
}

function buildBirds(){
  const mat = new THREE.MeshBasicMaterial({color:0x2b2b2b, side:THREE.DoubleSide});
  for(let i=0;i<7;i++){
    const b = new THREE.Group();
    const wL = new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.12), mat);
    const wR = new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.12), mat);
    wL.position.x=-0.16; wR.position.x=0.16;
    b.add(wL,wR);
    b.userData = {
      a: Math.random()*Math.PI*2,
      rad: 3 + Math.random()*4,
      hgt: 3 + Math.random()*5,
      spd: 0.25 + Math.random()*0.3,
      flap: Math.random()*Math.PI*2, wL, wR
    };
    world.add(b);
    birds.push(b);
  }
}

// ---------- the opening ceiling ("lid") ----------
// Built from the detected ceiling polygon; a shader hole grows open in it.
function buildLidFromPolygon(points, matrix){
  const shape = new THREE.Shape();
  points.forEach((p,i)=> i? shape.lineTo(p.x,p.z) : shape.moveTo(p.x,p.z));
  const geo = new THREE.ShapeGeometry(shape);
  // local xz -> varying for the hole test
  const pos = geo.attributes.position;
  const local = new Float32Array(pos.count*2);
  let cx=0, cz=0;
  for(let i=0;i<pos.count;i++){ cx+=pos.getX(i); cz+=pos.getY(i); }
  cx/=pos.count; cz/=pos.count;
  for(let i=0;i<pos.count;i++){ local[i*2]=pos.getX(i); local[i*2+1]=pos.getY(i); }
  geo.setAttribute('aLocal', new THREE.BufferAttribute(local,2));

  lidMat = new THREE.ShaderMaterial({
    transparent:true, side:THREE.DoubleSide,
    uniforms:{ holeR:{value:0.0}, center:{value:new THREE.Vector2(cx,cz)}, col:{value:new THREE.Color(0xe9e2d2)} },
    vertexShader:`attribute vec2 aLocal; varying vec2 vL;
      void main(){ vL=aLocal; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec2 vL; uniform float holeR; uniform vec2 center; uniform vec3 col;
      void main(){ float d=distance(vL,center);
        if(d<holeR) discard;
        float edge=smoothstep(holeR,holeR+0.25,d);
        gl_FragColor=vec4(col, 1.0)*edge + vec4(col,1.0)*(1.0-edge);
      }`
  });
  lid = new THREE.Mesh(geo, lidMat);
  lid.applyMatrix4(matrix);     // place at the real ceiling
  scene.add(lid);               // not in world group (already world-positioned)
  lid.userData.center3 = new THREE.Vector2(cx,cz);
  buildRoofRim(matrix);
  buildBeam(matrix);
  lidBuilt = true;
}

// fallback flat rectangular ceiling if no plane detected
function buildLidFallback(){
  const m = new THREE.Matrix4().makeTranslation(0, ceilingY, 0)
            .multiply(new THREE.Matrix4().makeRotationX(-Math.PI/2));
  const pts = [
    new THREE.Vector3(-2.5,0,-2.5), new THREE.Vector3(2.5,0,-2.5),
    new THREE.Vector3(2.5,0,2.5),  new THREE.Vector3(-2.5,0,2.5)
  ];
  // for ShapeGeometry we treat (x,z); pass as x,z
  buildLidFromPolygon(pts.map(p=>({x:p.x,z:p.z})), m);
}

// cute terracotta roof tiles around the opening edge
function buildRoofRim(matrix){
  roofRim = new THREE.Group();
  const tileMat = new THREE.MeshStandardMaterial({color:0xc4683f, roughness:.85, flatShading:true});
  const tiles = 30, R = 1.35;
  for(let i=0;i<tiles;i++){
    const a=(i/tiles)*Math.PI*2;
    const tile=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.06,0.34), tileMat);
    tile.position.set(Math.cos(a)*R, 0.02, Math.sin(a)*R);
    tile.lookAt(0,0.4,0);
    tile.rotateX(0.5);
    roofRim.add(tile);
  }
  roofRim.applyMatrix4(matrix);
  roofRim.scale.setScalar(0.001);
  scene.add(roofRim);
}

// volumetric golden light beam pouring through the opening
function buildBeam(matrix){
  const geo = new THREE.CylinderGeometry(0.2, 1.25, 3.0, 24, 1, true);
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending,
    uniforms:{ t:{value:0} },
    vertexShader:`varying float vy; void main(){ vy=uv.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying float vy; uniform float t;
      void main(){ float a=smoothstep(0.0,0.6,vy)*(1.0-vy)*0.55;
        a*=0.8+0.2*sin(t*1.5+vy*8.0);
        gl_FragColor=vec4(1.0,0.82,0.45,a);
      }`
  });
  beam = new THREE.Mesh(geo, mat);
  // hang it from the opening downward
  const m = matrix.clone().multiply(new THREE.Matrix4().makeTranslation(0,0,-1.5));
  beam.applyMatrix4(m);
  beam.scale.setScalar(0.001);
  scene.add(beam);
}

// ---------- detect ceiling from XR planes ----------
function scanPlanes(frame){
  if(ceilingFound || !frame.detectedPlanes) return;
  let best=null, bestY=-Infinity;
  for(const plane of frame.detectedPlanes){
    if(plane.orientation !== 'horizontal') continue;
    const pose = frame.getPose(plane.planeSpace, refSpace);
    if(!pose) continue;
    const y = pose.transform.position.y;
    if(y > bestY){ bestY=y; best={plane,pose}; }
  }
  // accept as ceiling if clearly above head height
  if(best && bestY > 1.6){
    ceilingY = bestY;
    ceilingFound = true;
    const m = new THREE.Matrix4().fromArray(best.pose.transform.matrix);
    const poly = best.plane.polygon.map(p=>({x:p.x, z:p.z}));
    buildLidFromPolygon(poly, m);
    // lower the forest world so the grove sits just above the opening
    world.position.y = ceilingY - 0.05;
  }
}

// ---------- render ----------
let noPlaneTimer = 0;
function render(t, frame){
  const dt = clock.getDelta();
  if(frame){
    scanPlanes(frame);
    // fallback: if a few seconds pass with no ceiling, open a default one
    if(!lidBuilt){
      noPlaneTimer += dt;
      if(noPlaneTimer > 4){ world.position.y = ceilingY - 0.05; buildLidFallback(); }
    }
  }

  // opening animation
  if(lidBuilt && openT < 1){
    openT = Math.min(1, openT + dt*0.32);
    const e = 1 - Math.pow(1-openT, 3); // ease-out cubic
    lidMat.uniforms.holeR.value = 1.35 * e;
    roofRim.scale.setScalar(Math.max(0.001, e));
    beam.scale.setScalar(Math.max(0.001, e));
  }

  // tree sway
  const time = clock.elapsedTime;
  for(const tr of trees){ tr.rotation.z = Math.sin(time*0.6 + tr.userData.sway)*0.02; }

  // birds circling + flapping
  for(const b of birds){
    const u=b.userData; u.a += u.spd*dt; u.flap += dt*9;
    const x=Math.cos(u.a)*u.rad, z=Math.sin(u.a)*u.rad;
    b.position.set(x, u.hgt + Math.sin(u.a*2)*0.4, z);
    b.lookAt(Math.cos(u.a+0.1)*u.rad, b.position.y, Math.sin(u.a+0.1)*u.rad);
    const f=Math.sin(u.flap)*0.6;
    u.wL.rotation.z= f; u.wR.rotation.z=-f;
  }

  if(beam) beam.material.uniforms.t.value = time;

  renderer.render(scene, camera);
}
</script>
</body>
</html>
